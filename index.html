<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c6e5ff" />
    <title>Fold It</title>
    <meta name="description" content="Fold a sheet of paper in half, again and again. How many folds until it reaches the Moon?" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <canvas id="bg"></canvas>
      <div id="deep" class="layer"></div>
      <canvas id="fg"></canvas>
      <div id="things" class="layer"></div>
      <div id="marks" class="layer"></div>

      <header class="topbar">
        <button class="brand" id="brand" aria-label="Fold It, start over">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 8h11l9 4v12H15L6 20z" fill="currentColor" opacity=".25"/><path d="M6 8h11v12H6z" fill="currentColor"/><path d="M17 8l9 4v12l-9-4z" fill="currentColor" opacity=".6"/></svg>
          <span>Fold It</span>
        </button>
        <div class="tools">
          <button class="icon-btn" id="sound" aria-label="Toggle sound" title="Sound (M)">
            <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="restart" aria-label="Start over" title="Start over">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M4 4v5h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <section class="counter" aria-live="polite">
        <div class="c-label">Folds</div>
        <div class="c-num" id="num">0</div>
        <div class="c-thick"><span id="tv">0.1</span> <span id="tu">mm</span></div>
        <div class="c-layers" id="layers">1 layer</div>
      </section>

      <aside class="rail" id="rail" aria-hidden="true">
        <div class="rail-track"><div class="rail-fill" id="railFill"></div></div>
        <div class="rail-ticks" id="railTicks"></div>
        <div class="rail-dot" id="railDot"></div>
      </aside>

      <footer class="dock">
        <div class="caption" id="caption">
          <div class="cap-tag" id="capTag"></div>
          <p id="capText"></p>
        </div>
        <div class="controls">
          <button class="round-btn" id="unfold" aria-label="Unfold" title="Unfold (←)">
            <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="fold-btn" id="fold">
            <span class="fold-ico" aria-hidden="true"><i></i><i></i></span>
            <span class="fold-txt">Fold</span>
          </button>
          <div class="round-spacer"></div>
        </div>
        <div class="hint" id="hint">Press <kbd>Space</kbd> to fold, hold it to keep going</div>
      </footer>

      <div class="overlay intro" id="intro">
        <div class="intro-card">
          <div class="sheet-demo" aria-hidden="true">
            <div class="sd-stage"><div class="sd-half l"></div><div class="sd-half r"></div></div>
          </div>
          <p class="eyebrow">An experiment in doubling</p>
          <h1>Fold <em>It</em></h1>
          <p class="lede">A sheet of paper is <b>0.1&nbsp;mm</b> thick. Fold it in half, then in half again, and again.</p>
          <p class="lede q">How many folds until it reaches the <b>Moon</b>?</p>
          <div class="guess">
            <button class="g-step" data-step="-1" aria-label="Fewer">−</button>
            <label class="g-field">
              <input id="guess" type="number" inputmode="numeric" min="1" max="1000000" value="1000" aria-label="Your guess" />
              <span>folds</span>
            </label>
            <button class="g-step" data-step="1" aria-label="More">+</button>
          </div>
          <button class="primary" id="start">Start folding <span aria-hidden="true">→</span></button>
          <p class="fine">Best with sound on</p>
        </div>
      </div>

      <div class="overlay finale" id="finale" hidden>
        <div class="finale-card">
          <div class="f-tag" id="fTag">Fold 42</div>
          <h2 id="fTitle">You reached the Moon.</h2>
          <p id="fText"></p>
          <div class="f-guess" id="fGuess"></div>
          <div class="f-actions">
            <button class="primary" id="fGo">Keep folding</button>
            <button class="ghost" id="fShare">Share</button>
            <button class="ghost" id="fAgain">Start over</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
